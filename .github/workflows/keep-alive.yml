name: Keep-alive backend

# Render (free) duerme el backend tras 15 min sin tráfico: la primera carga
# del panel o de la tienda tarda 20-40s en despertarlo. Este ping cada 10 min
# mantiene la instancia despierta.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar Render
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://tierra-verde-backend.onrender.com/health/ || true)
            echo "intento $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "El backend no respondio 200 tras 3 intentos"
          exit 1
